services:
  - type: web
    name: slack-poll-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    # Render restarts an instance that fails this. /health tolerates a short
    # database blip before failing, so a cold start does not cost a restart -
    # see lib/health.js and README (Staying awake).
    healthCheckPath: /health
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      # Set to https://<your-service>.onrender.com/health to stop the free
      # instance sleeping (see README: Staying awake)
      - key: KEEPALIVE_URL
        sync: false
      # Multi-workspace installs only (leave SLACK_BOT_TOKEN unset if used)
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
